<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OKURI - 오케이 우리 </title>

    <meta name="og:title" content="OKURI - 오케이 우리" />
    <meta name="og:description" content="우리끼리 사용하는 가족 SNS" />
    <meta name="og:image" content="/thumbnail.png" />

    <script>
      // 테마 설정(Theme Setting)
      try {
        const themeStore = localStorage.getItem("ThemeStore")
          ? JSON.parse(localStorage.getItem("ThemeStore"))
          : null;

        const theme = themeStore.state.theme;

        const htmlTag = document.documentElement;
        htmlTag.classList.remove("dark", "light");

        if (theme === "system") {
          const isDarkTheme = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;

          htmlTag.classList.add(isDarkTheme ? "dark" : "light");
        } else {
          htmlTag.classList.add(theme);
        }
      } catch (error) {
        console.error(error);
      }
    </script>
  </head>
  <body class="md:bg-background-secondary">
    <div id="root"></div>
    <!-- 모달 렌더링 위치 -->
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
